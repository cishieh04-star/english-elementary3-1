<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>123 數字火車大冒險</title>
<style>
:root{--deep:#6a3fc0;--navy:#3e2a7a;--red:#ff5a4f;--yellow:#ffd23f;--blue:#2f80ed;--green:#22b573;--ink:#1d2433;--pink:#ff5f8f;--purple:#8a5cf6;--sand:#f7e1a6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#d9c8ff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
button{font-family:inherit;border:none;cursor:pointer}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
.eng{font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold","Trebuchet MS",sans-serif}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#bfe3ff 0%,#e6dcff 42%,#ffe3ef 70%,#b9e88a 70%,#8fd35a 90%,#8a6a4a 90%,#6d5238 100%)}
#bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bg i{position:absolute;bottom:9%;border-radius:50% 50% 0 0;background:linear-gradient(#a8e27c,#86cc5a);opacity:.75}
#bg i b{display:none}
#bg .track{position:absolute;left:0;right:0;bottom:4%;height:16px;background:repeating-linear-gradient(90deg,#6d4c2f 0 9px,transparent 9px 26px),linear-gradient(transparent 3px,#b8c0cc 3px 6px,transparent 6px 10px,#b8c0cc 10px 13px,transparent 13px)}
@keyframes walkL{from{transform:translateX(115vw)}to{transform:translateX(-25vw)}}
#bg .weed{position:absolute;bottom:0;font-size:clamp(28px,7vmin,56px);animation:bob 3s ease-in-out infinite}
#bg .planet{position:absolute;font-size:clamp(34px,9vmin,72px);opacity:.85}
#bg .walk{position:absolute;bottom:2%;font-size:clamp(26px,6.5vmin,48px);animation:walk linear infinite}
@keyframes walk{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
#bg .fenceX{position:absolute;left:0;right:0;top:calc(40% - 26px);height:30px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 46px),linear-gradient(transparent 7px,#fff 7px 12px,transparent 12px 20px,#fff 20px 25px,transparent 25px);opacity:.75}
@keyframes cloud{to{transform:translateX(150vw)}}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px)}}
@keyframes sway{50%{transform:rotate(8deg)}}
#topbar,#hdr,#play{position:relative;z-index:1}
#topbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#8a5cf6,#6a3fc0);color:#fff;box-shadow:0 3px 0 #0004;z-index:5}
.tbtn{font-size:clamp(15px,3.6vmin,21px);font-weight:900;padding:6px 12px;border-radius:12px;background:#fff;color:var(--navy);box-shadow:0 3px 0 #0005;white-space:nowrap}
.tbtn.warn{background:var(--yellow)}
#title{flex:1;min-width:0;text-align:center;font-weight:900;font-size:clamp(15px,3.8vmin,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-weight:900;font-size:clamp(14px,3.6vmin,21px);background:#ffffff26;padding:4px 10px;border-radius:12px;white-space:nowrap}
#hdr{flex:none;display:flex;flex-direction:column;gap:5px;padding:6px 8px 2px}
#ctrl{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.cbtn{font-size:clamp(14px,3.4vmin,20px);font-weight:900;padding:6px 11px;border-radius:14px;color:#fff;white-space:nowrap;box-shadow:0 4px 0 #0003}
.cbtn:active{transform:translateY(3px);box-shadow:none}
#again{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #b8900a}
#rSlow{background:#2f80ed}#rFast{background:#e53935}
#gBtn{background:#5b6578}#gBtn.off{background:var(--green)}
#rNow{font-weight:900;font-size:clamp(13px,3vmin,18px);background:#fff;border:3px solid var(--navy);border-radius:12px;padding:2px 8px;white-space:nowrap}
#prompt{display:flex;justify-content:center}
#ptext{background:#fff;border:4px solid var(--navy);border-radius:18px;padding:3px 14px;font-size:clamp(17px,4.4vmin,30px);font-weight:900;text-align:center;box-shadow:0 4px 0 #0002;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.pl{font-size:1.45em;color:var(--red)}
.dim{filter:grayscale(1);opacity:.45}
.nope{animation:shake .35s}
@media (max-width:520px){.cbtn{padding:5px 7px;font-size:14px}#rNow{font-size:13px;padding:1px 4px}#rNow .lab{display:none}#ctrl{gap:4px}.tbtn{padding:5px 8px;font-size:15px}.pill{padding:3px 6px;font-size:14px}}
@media (max-width:380px){.cbtn{padding:4px 5px;font-size:13px;border-radius:11px}#ctrl{gap:3px}#rNow{font-size:12px;padding:1px 3px;border-width:2px}}
@media (max-height:470px) and (min-width:560px){#hdr{flex-direction:row;align-items:center;justify-content:center;padding:4px 6px 0}#ptext{padding:2px 10px;font-size:clamp(16px,4.6vmin,24px)}}
#play{flex:1;min-height:0;container-type:size;overflow:hidden}
.slots{display:inline-flex;gap:6px;margin-left:6px}
.slot{min-width:1.5em;padding:0 6px;border-bottom:4px solid var(--navy);color:#bbb;text-align:center}
.slot.on{color:var(--blue);border-color:var(--blue)}
.slot i{font-style:normal;opacity:0;transition:opacity .2s}
.slot.say{background:#fff3b0;border-radius:6px}
.slot.say i{opacity:.55}
.slot.cur{border-bottom-color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{border-bottom-color:transparent}}
.hint{animation:hintGlow 1.1s infinite!important}
@keyframes hintGlow{50%{box-shadow:0 0 0 8px #ffd23f,0 0 24px 10px #ffd23fcc}}
.blank{display:inline-block;min-width:1em;border-bottom:4px solid var(--red);color:var(--red)}
.fl{color:var(--red)}
.lt{display:inline-block;border-radius:6px;transition:background .15s,transform .15s}
.lt.say{background:#fff3b0;color:var(--red);transform:scale(1.25)}
.paused #bg i,.paused .mup,.paused .bubw,.paused .fishw,.paused .fishflip,.paused .wheel,.paused .cab,.paused .fishbg{animation-play-state:paused!important}
/* ---------- 標題畫面 ---------- */
.titlescr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}
.tin{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transform-origin:center center}
.logo{font-size:clamp(34px,9vmin,72px);font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 4px 0 #0b4f8a,0 8px 0 #0003;-webkit-text-stroke:2px #0b4f8a;paint-order:stroke fill;line-height:1.1}
.tsub{font-size:clamp(17px,4.2vmin,28px);font-weight:900;background:#fff;color:var(--deep);padding:3px 16px;border-radius:999px;box-shadow:0 4px 0 #0002}
.tcard{background:#ffffffee;border-radius:24px;padding:12px 14px;box-shadow:0 6px 0 #0002;width:min(94vw,560px);display:flex;flex-direction:column;gap:8px;align-items:center}
.tlab{font-weight:900;color:#4a5a73;font-size:clamp(14px,3.4vmin,19px)}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.avs button{width:clamp(44px,10vmin,58px);height:clamp(44px,10vmin,58px);border-radius:16px;font-size:clamp(26px,6.4vmin,36px);background:#eaf6ff;border:3px solid transparent}
.avs button.sel{border-color:var(--pink);background:#ffe6ef;transform:scale(1.1)}
.nmin{width:100%;font-size:clamp(18px,4.4vmin,24px);font-weight:800;padding:6px 12px;border-radius:14px;border:3px solid #cfe3f5;text-align:center;color:var(--ink)}
.bigb{font-size:clamp(20px,5vmin,30px);font-weight:900;padding:10px 26px;border-radius:18px;color:#fff;box-shadow:0 5px 0 #0004;white-space:nowrap}
.bigb:active{transform:translateY(4px);box-shadow:0 1px 0 #0004}
.bigb.g{background:var(--green)}.bigb.b{background:var(--blue)}.bigb.r{background:var(--red)}.bigb.p{background:var(--purple)}.bigb.y{background:var(--yellow);color:var(--ink)}.bigb.gray{background:#6b7280}
.mascot svg{width:clamp(80px,20vmin,140px);height:auto;animation:bob 1.8s ease-in-out infinite;overflow:visible}
/* ---------- 地圖 ---------- */
.mapscr{position:absolute;inset:0;display:flex;flex-direction:column}
.marea{flex:1;position:relative;min-height:0}
.marea svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0;z-index:2}
.orb{width:var(--o);height:var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--o)*.52);background:radial-gradient(circle at 30% 25%,#fff 0 10%,var(--c1) 42%,var(--c2));border:4px solid #fff;box-shadow:0 5px 0 #0003;position:relative}
.node:active .orb{transform:scale(.94)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 6px #ffd23f,0 0 26px 12px #ffd23fcc}
.node.boss .orb{--c1:#b8c4d2!important;--c2:#43536a!important}
.node.done .orb::after{content:"✔";position:absolute;right:-6%;bottom:-6%;width:38%;height:38%;border-radius:50%;background:var(--green);color:#fff;font-size:calc(var(--o)*.22);display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.nm{background:#fff;border-radius:10px;padding:1px 7px;font-weight:900;font-size:var(--f);white-space:nowrap;box-shadow:0 2px 0 #0002;line-height:1.35}
.nst{font-size:calc(var(--f)*.95);line-height:1;letter-spacing:1px;filter:drop-shadow(0 1px 0 #0004)}
.nst .off{filter:grayscale(1) brightness(1.6);opacity:.55}
.here{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:900;font-size:var(--f);border-radius:10px;padding:0 8px;white-space:nowrap;animation:bob 1s infinite;box-shadow:0 3px 0 #0003}
.dock{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px 8px 8px;background:#6a3fc0cc}
.dbtn{flex:1 1 auto;font-size:clamp(15px,3.8vmin,22px);font-weight:900;padding:8px 10px;border-radius:16px;color:#fff;box-shadow:0 4px 0 #0004;white-space:nowrap}
.dbtn:active{transform:translateY(3px);box-shadow:none}
.dbtn.go{background:var(--green);font-size:clamp(17px,4.4vmin,26px);animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
/* ---------- 關卡開場 ---------- */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh;cursor:pointer;text-align:center;padding:8px}
.intro .n{font-size:min(8cqw,9cqh);font-weight:900;color:#fff;background:var(--deep);padding:.6cqh 6cqw;border-radius:24px;box-shadow:0 6px 0 #0004}
.intro .b{font-size:min(22cqw,26cqh);line-height:1.1;animation:bob 1s infinite}
.intro .t{font-size:min(9cqw,11cqh);font-weight:900;color:var(--deep);background:#fff;padding:.6cqh 5cqw;border-radius:20px;border:5px solid var(--yellow)}
.intro .h{font-size:min(4.6cqw,6cqh);font-weight:800;color:var(--ink);background:#ffffffee;border-radius:14px;padding:.4cqh 3cqw;max-width:94cqw}
.intro .go{font-size:min(4.6cqw,6cqh);font-weight:900;color:#fff;background:var(--green);border-radius:14px;padding:.6cqh 4cqw;box-shadow:0 4px 0 #0003;animation:pulse2 1.2s infinite}
/* ---------- 學字母 ---------- */
.learn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4cqmin;padding:8px}
.lcard{background:#fff;border-radius:24px;border:6px solid var(--navy);padding:0 4cqmin;font-weight:900;line-height:1.15;cursor:pointer;box-shadow:0 6px 0 #0003;text-align:center;font-size:min(17cqw,40cqh)}
.lcard .U{color:var(--red)}.lcard .l{color:var(--blue)}
.lcard.pulse{animation:pulse 1s infinite}
.lpair{display:flex;gap:3cqmin}
.lcard .tag{display:block;font-size:min(4cqw,7cqh);color:#555;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.3;margin-bottom:.5cqh}
.lcard .tag b{font-family:"Comic Sans MS","Chalkboard SE",sans-serif;color:var(--deep)}
.lcard.bad{opacity:1;filter:none}
.lwords{display:flex;gap:3cqmin}
.lw{background:#fffbe8;border-radius:18px;border:4px solid #f5b400;padding:1cqmin 3cqmin;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
.lw .em{font-size:min(12cqw,24cqh);line-height:1.2}
.lw .wd{font-size:min(6cqw,10cqh);font-weight:900}
.zhw{font-size:min(4cqw,6.5cqh);font-weight:800;color:#666}
.lw.dimw{opacity:.7}
@container (max-aspect-ratio:1/1){.learn{flex-direction:column}.lpair .lcard{font-size:min(28cqw,20cqh)}.lcard .tag{font-size:min(5cqw,3.4cqh)}.lw .em{font-size:min(18cqw,13cqh)}.lw .wd{font-size:min(8cqw,5.5cqh)}.zhw{font-size:min(5cqw,3.6cqh)}}
/* ---------- 描字 ---------- */
.traceWrap{position:absolute;inset:0}
.traceWrap canvas{position:absolute;inset:0;touch-action:none}
.redo{position:absolute;right:10px;bottom:10px;font-size:clamp(16px,4vmin,24px);font-weight:900;padding:6px 16px;border-radius:14px;background:#fff;border:3px solid var(--navy)}
.tbar{position:absolute;left:10px;bottom:14px;width:min(40cqw,260px);height:18px;border-radius:9px;background:#fff;border:3px solid var(--navy);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a00);transition:width .15s}
.sandbg{position:absolute;inset:6px;border-radius:22px;background:linear-gradient(#2e7d4f,#256b42);border:12px solid #b8865b;box-shadow:inset 0 0 0 3px #8a5a32}
/* ---------- 摩天輪 ---------- */
.wheelWrap{position:absolute;left:50%;top:48%;--W:min(76cqw,82cqh);width:var(--W);height:var(--W);transform:translate(-50%,-50%)}
.wheelWrap.lg{--W:min(72cqw,74cqh)}
.legs{position:absolute;left:50%;top:50%}
.legs::before,.legs::after{content:"";position:absolute;left:calc(var(--W)*-.02);top:0;width:calc(var(--W)*.04);height:calc(var(--W)*.6);background:#ff8a65;border-radius:8px;transform-origin:top center}
.legs::before{transform:rotate(24deg)}.legs::after{transform:rotate(-24deg)}
.wheel{position:absolute;inset:0;border-radius:50%;border:calc(var(--W)*.022) solid #ffd23f;animation:spin var(--spin) linear infinite}
.wheel::before{content:"";position:absolute;inset:20%;border-radius:50%;border:calc(var(--W)*.012) solid #fff3b0}
.spoke{position:absolute;left:0;right:0;top:50%;height:calc(var(--W)*.012);margin-top:calc(var(--W)*-.006);background:#fff3b0}
.hub{position:absolute;left:50%;top:50%;width:calc(var(--W)*.12);height:calc(var(--W)*.12);transform:translate(-50%,-50%);border-radius:50%;background:var(--pink);border:4px solid #fff;box-shadow:0 3px 0 #0003}
.gond{position:absolute;left:50%;top:50%;width:var(--G);height:var(--G);margin-left:calc(var(--G) / -2);margin-top:calc(var(--G) / -2);transform:rotate(var(--a)) translateY(calc(var(--W) * -.40)) rotate(calc(var(--a) * -1))}
.cab{width:100%;height:100%;animation:spin var(--spin) linear infinite reverse;display:flex;flex-direction:column;align-items:center}
.still .wheel,.still .cab{animation:none}
.cab .hook{width:4px;height:12%;background:#555}
.box{flex:1;width:100%;border-radius:24% 24% 32% 32%;background:var(--c);border:3px solid #fff;box-shadow:0 5px 0 #0003;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
.box .in{background:#fff;border-radius:20%;width:84%;height:74%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--G) * .42);font-weight:900;line-height:1;text-align:center}
.box.long .in{font-size:calc(var(--G) * .15);flex-direction:column;line-height:1.15;padding:2px}
.box:active{transform:scale(.93)}
.ph .pi{font-size:1.9em;display:block}.ph small{display:block;color:#666;font-size:.8em}
/* ---------- 夾娃娃機 ---------- */
.cm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column}
.cm-top{height:12%;background:linear-gradient(#ff7aa8,#e0356b);color:#fff;font-weight:900;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,4.5cqmin,28px);letter-spacing:6px}
.cm-glass{flex:1;position:relative;background:linear-gradient(135deg,#eefaff,#c9ecff);border:6px solid #ff5f8f;border-top:none;border-radius:0 0 18px 18px;overflow:hidden}
.cm-rail{position:absolute;left:0;right:0;top:0;height:8px;background:#8b95a5}
.cm-claw{position:absolute;top:8px;left:50%;transform:translateX(-50%);transition:left .55s ease-in-out;display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none}
.cm-str{width:4px;height:8px;background:#555;transition:height .6s ease-in-out}
.cm-head{position:relative;width:48px;height:38px}
.cm-head i{position:absolute;left:9px;right:9px;top:0;height:14px;background:#6b7280;border-radius:6px}
.cm-head b{position:absolute;top:9px;width:8px;height:28px;background:#9ca3af;border-radius:4px;transition:transform .25s;transform-origin:top center}
.cm-head .l{left:7px;transform:rotate(28deg)}.cm-head .r{right:7px;transform:rotate(-28deg)}
.closed .cm-head .l{transform:rotate(4deg)}.closed .cm-head .r{transform:rotate(-4deg)}
.cm-prizes{position:absolute;left:2%;right:2%;bottom:3%;display:flex;flex-wrap:wrap;justify-content:space-around;align-items:flex-end;gap:6px 4px}
.prize{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:radial-gradient(circle at 32% 28%,#fff 0 10%,transparent 11%),linear-gradient(var(--c) 0 50%,#fff 50%);border:3px solid #0002;box-shadow:0 4px 0 #0002;cursor:pointer;position:relative;z-index:2}
.prize .in{background:#ffffffe6;border-radius:40%;padding:0 .12em;line-height:1.1}
.prize.won{animation:pop .5s forwards}
.prize.long .in{font-size:.5em}
/* ---------- 一排選項（貝殼／大魔王） ---------- */
.rowc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:6px}
.showc{flex:none;font-size:min(16cqw,24cqh);font-weight:900;color:var(--red);background:#fff;border:6px solid var(--yellow);border-radius:24px;padding:0 6cqw;line-height:1.15;box-shadow:0 6px 0 #0002;margin-top:1cqh}
.ropts{flex:1;width:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px}
.ropt{border-radius:26px;background:var(--c);border:5px solid #fff;box-shadow:0 6px 0 #0003;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;transition:transform .15s}
.ropt:active{transform:scale(.94)}
.ropt .in{background:#fff;border-radius:22%;width:76%;height:76%;display:flex;align-items:center;justify-content:center;line-height:1}
.ropt.shell{border-radius:50% 50% 44% 44%/56% 56% 40% 40%;background:radial-gradient(circle at 30% 26%,#ffffffaa 0 9%,transparent 10%),var(--c);border:4px solid #fff;overflow:visible;position:relative}
.ropt.shell::before{content:"";position:absolute;top:-10%;left:44%;width:14%;height:14%;border-radius:50%;background:#e53935;border:2px solid #fff}
.ropt.shell::after{content:"";position:absolute;top:84%;left:20%;width:60%;height:44%;background:repeating-linear-gradient(45deg,#d99a4e 0 6px,#c4823a 6px 9px),#d99a4e;clip-path:polygon(0 0,100% 0,50% 100%);z-index:-1}
.ropt.shell .in{border-radius:50%;width:62%;height:62%;margin-top:-4%}
/* ---------- 泡泡 ---------- */
.bubw{position:absolute;animation:floaty ease-in-out infinite alternate}
@keyframes floaty{from{transform:translate(-4px,-3cqh)}to{transform:translate(4px,3cqh)}}
.bub{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;color:var(--ink);position:relative;background:#fff;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c) 80%,#000)) drop-shadow(0 6px 0 #0002)}
.bub::after{content:"";position:absolute;right:-30%;top:34%;width:58%;height:58%;border-radius:50%;background:#fff;z-index:-1}
.bub::before{content:"";position:absolute;left:-30%;top:30%;width:62%;height:62%;border-radius:50%;background:#fff;z-index:-1}
.bub .in{color:color-mix(in srgb,var(--c) 60%,#000);display:flex;align-items:center;justify-content:center;font-size:1.45em}
.popw{animation:popb .4s forwards!important}
@keyframes popb{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}
/* ---------- 魚 ---------- */

  const col=['#e53935','#2f80ed','#8e24aa','#f57c00','#d81b60','#00897b'][(ch.toLowerCase().charCodeAt(0)+(ch===ch.toUpperCase()?0:3))%6];

/* 拼字 / 排句子：先慢慢唸整個字與每個字母，等待時不斷重複，並提示「下一個要夾哪一個」 */
async function assemble(tokens,extras,head,full,introZh,asmStyle='claw'){
  const filled=[];let pool=shuffle([...tokens.map(t=>({t,real:true})),...extras.map(t=>({t,real:false}))]);
  const long=tokens.some(t=>t.length>2),isL=tokens.every(t=>t.length===1);
  const nmT=t=>isL?nm(t):t;
  const show=cur=>setPrompt(`${head}<span class="slots">${tokens.map((t,i)=>`<span class="slot eng ${i<filled.length?'on':''} ${i===cur?'cur':''}">${i<filled.length?t:`<i>${t}</i>`}</span>`).join('')}</span>`,m=>runSteps(spellSteps(),()=>false,m));
  const flash=k=>{const sl=$('ptext').querySelectorAll('.slot');sl.forEach((x,j)=>x.classList.toggle('say',j===k));};
  const spellSteps=()=>{const st=[{fn:()=>flash(-1)},{en:full},{p:T(700)}];tokens.forEach((t,k)=>st.push({fn:()=>flash(k)},{en:nmT(t)},{p:T(isL?650:450)}));st.push({fn:()=>flash(-1)},{p:T(300)},{en:full});return st;};
  for(let i=0;i<tokens.length;i++){
    show(i);const ci=pool.findIndex(p=>p.real&&p.t===tokens[i]);
    const next=[{p:T(500)},{zh:asmStyle==='claw'?(i===0?'第一個，要夾':'下一個，要夾'):(i===0?'第一個，要點':'下一個，要點')},{fn:()=>flash(i)},{en:nmT(tokens[i])},{p:T(800)},{en:nmT(tokens[i])},{fn:()=>flash(-1)}];
    const copt={accept:k=>pool[k].t===tokens[i],style:asmStyle,
      onWrong:async k=>{await say(nmT(pool[k].t));await zh('不是這個喔');},
      coach:it=>{
        if(it===0&&i===0)return[...(introZh?[{zh:introZh}]:[]),...spellSteps(),...next];
        if(it===0)return next;
        return[...spellSteps(),...next];
      }};
    await choose(pool.map(x=>({html:x.t,say:x.t,long})),ci,copt);
    filled.push(tokens[i]);pool.splice(copt.picked,1);show(i+1);
  }
  show(-1);await runSteps(spellSteps(),()=>false);
}

  <div class="srow"><span>英文聲音</span><select class="vsel" id="vEn"></select><button class="opt" id="tEn">試聽</button></div>
  <div class="srow"><span>中文聲音</span><select class="vsel" id="vZh"></select><button class="opt" id="tZh">試聽</button></div>
  <div style="font-size:14px;color:#666;margin:4px;line-height:1.6">「數一數」最後拼英文數字、「ABC 字母歌」和「教室英語」會用上面選的樣式；排句子固定用夾娃娃機。<br>等待作答時，英文會一直重複唸；重複兩次後，正確答案會發光提示。星星每次打開遊戲都從 0 開始。</div>
  <button class="bigb r" id="sClose">關閉</button>`);
  m.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{S[b.dataset.k]=JSON.parse(b.dataset.v);save();m.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('on',x===b));});
  const fillV=(id,fam,key)=>{const sel=m.querySelector(id);const ops=voiceOptions(fam);
    sel.innerHTML=`<option value="">手機預設（建議）</option>`+ops.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${S[key]===v.name?'selected':''}>${v.name}（${v.lang}）</option>`).join('');
    sel.onchange=()=>{S[key]=sel.value;save();};};
  fillV('#vEn','en','enVoice');fillV('#vZh','zh','zhVoice');
  m.querySelector('#tEn').onclick=()=>{sCancel();unlockAudio();say('one, two, three. Stand up, please. A, B, C.').catch(()=>{});};
  m.querySelector('#tZh').onclick=()=>{sCancel();unlockAudio();speak('早安，小朋友，我們一起坐火車學英文。','zh-TW').catch(()=>{});};
  m.querySelector('#sClose').onclick=()=>{sCancel();m.remove();showMap();};
}

/* ================= 上方按鈕 ================= */
$('btnHome').onclick=()=>showMap();
$('btnPause').onclick=()=>{
  if(paused)return;paused=true;sCancel();document.body.classList.add('paused');
  const m=modal(`<div class="pauseMsg">🚂</div><h2>休息一下</h2><button class="bigb g" id="pGo">繼續</button>`);
  m.querySelector('#pGo').onclick=()=>{m.remove();paused=false;document.body.classList.remove('paused');if(repeatFn)Promise.resolve(repeatFn()).catch(()=>{});};
};
/* 背景山丘、鐵軌、小火車 */
(function(){const bg=$('bg');let h='<div class="track"></div>';let x=-6;while(x<100){const w=18+Math.random()*16,ht=8+Math.random()*12;h+=`<i style="left:${x}%;width:${w}%;height:${ht}%"></i>`;x+=w*.7;}
  h+='<span class="planet" style="right:4%;top:5%">🌈</span><span class="planet" style="left:4%;top:8%;font-size:clamp(28px,7vmin,54px)">☁️</span><span class="walk" style="animation-name:walkL;animation-duration:30s;bottom:3%">🚂🚃🚃</span>';bg.innerHTML=h;})();
/* 手機上手指滑動時，整個畫面不跟著移動（只有設定視窗可以捲動） */
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('.mbox')))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(mode==='map')layoutMap();else if(mode==='title')fitTitle();},120);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)sCancel();});
showTitle();
</script>
